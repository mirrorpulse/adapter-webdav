name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build-and-test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Verify Adapter build
        run: pwsh ./eng/verify.ps1
      - name: Verify release input and dual-RID packaging without production keys
        run: pwsh -NoProfile -File eng/verify-release.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: webdav-process-${{ matrix.runner }}
          path: |
            artifacts/test-results/*.trx
            artifacts/release/**/native-conformance.json
          if-no-files-found: error
          retention-days: 365
