name: Signed Adapter Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical numeric version without the v prefix
        required: true
        default: 0.1.0
      publish:
        description: Publish a Release after signing; false only uploads verified artifacts
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: adapter-release-${{ github.ref }}
  cancel-in-progress: false

env:
  MP_RELEASE_EVENT: ${{ github.event_name }}
  MP_RELEASE_REF: ${{ github.ref_name }}
  MP_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Require release source on the main history
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release source must belong to the main branch history.' }
      - name: Verify repository
        run: pwsh -NoProfile -File eng/verify.ps1
      - name: Validate input and build both payloads without signing secrets
        id: pack
        run: pwsh -NoProfile -File eng/pack-adapter.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-adapter
          path: ${{ steps.pack.outputs.package }}
          if-no-files-found: error

  sign:
    needs: build
    runs-on: windows-latest
    environment: adapter-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-adapter
          path: artifacts/signing
      - name: Sign existing package and verify its embedded inventory
        env:
          MIRRORPULSE_ADAPTER_SIGNING_PFX_BASE64: ${{ secrets.MIRRORPULSE_ADAPTER_SIGNING_PFX_BASE64 }}
          MIRRORPULSE_ADAPTER_SIGNING_PFX_PASSWORD: ${{ secrets.MIRRORPULSE_ADAPTER_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -LiteralPath artifacts/signing -File -Filter '*.mpadapter')
          if ($packages.Count -ne 1) { throw 'Exactly one built package is required.' }
          ./eng/sign-adapter.ps1 -PackagePath $packages[0].FullName
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-adapter
          path: artifacts/signing/*
          if-no-files-found: error

  verify:
    needs: sign
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mirrorpulse/MirrorPulse
          ref: 16c6742536e4fa54aa37d92d1fe7b11d2ac5bf5e
          path: mirrorpulse-verifier
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-adapter
          path: artifacts/candidate
      - name: Verify newly signed package through Host and real protocol fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: ./eng/verify-host-worker.ps1 -MirrorPulseRoot mirrorpulse-verifier -CandidateDirectory artifacts/candidate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-protocol-evidence
          path: |
            mirrorpulse-verifier/artifacts/candidate-evidence.json
            mirrorpulse-verifier/artifacts/test-results/candidate/*
          if-no-files-found: error

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: windows-latest
    environment: adapter-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-adapter
          path: artifacts/release
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -LiteralPath artifacts/release -File -Filter '*.mpadapter')
          if ($packages.Count -ne 1) { throw 'Exactly one signed package is required.' }
          ./eng/verify-adapter-signature.ps1 -PackagePath $packages[0].FullName
          ./eng/publish-adapter-release.ps1 -PackagePath $packages[0].FullName
