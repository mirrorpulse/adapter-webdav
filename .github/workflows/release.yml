name: Signed Adapter Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Preview from develop; stable dry run from main
        type: choice
        options: [Preview, Stable]
        default: Preview
      publish:
        description: Publish a verified candidate through the release environment
        type: boolean
        default: false
      confirm:
        description: Type PUBLISH for an actual preview publication
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: adapter-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the trusted channel and classified source
        id: version
        env:
          MP_RELEASE_EVENT: ${{ github.event_name }}
          MP_RELEASE_CHANNEL: ${{ inputs.channel }}
          MP_RELEASE_PUBLISH: ${{ inputs.publish }}
          MP_RELEASE_CONFIRM: ${{ inputs.confirm }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./eng/resolve-adapter-publication.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: provider-version
          path: artifacts/provider-version.json
          if-no-files-found: error
          retention-days: 365

  build:
    needs: resolve
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: provider-version
          path: artifacts
      - name: Verify source and build both payloads without production credentials
        id: pack
        env:
          MP_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          ./eng/verify.ps1
          ./eng/pack-adapter.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-adapter
          path: |
            ${{ steps.pack.outputs.package }}
            artifacts/provider-version.json
          if-no-files-found: error
          retention-days: 365

  sign:
    needs: [resolve, build]
    runs-on: windows-latest
    environment: adapter-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-adapter
          path: artifacts/signing
      - name: Sign a dry-run candidate with a disposable in-memory key
        if: needs.resolve.outputs.publish != 'true'
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/signing -Recurse -File -Filter '*.mpadapter')
          if ($packages.Count -ne 1) { throw 'Exactly one unsigned package is required.' }
          ./eng/sign-adapter.ps1 -PackagePath $packages[0].FullName -DryRun
      - name: Sign a trusted publication candidate
        if: needs.resolve.outputs.publish == 'true'
        env:
          MIRRORPULSE_ADAPTER_SIGNING_PFX_BASE64: ${{ secrets.MIRRORPULSE_ADAPTER_SIGNING_PFX_BASE64 }}
          MIRRORPULSE_ADAPTER_SIGNING_PFX_PASSWORD: ${{ secrets.MIRRORPULSE_ADAPTER_SIGNING_PFX_PASSWORD }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/signing -Recurse -File -Filter '*.mpadapter')
          if ($packages.Count -ne 1) { throw 'Exactly one unsigned package is required.' }
          ./eng/sign-adapter.ps1 -PackagePath $packages[0].FullName
      - name: Freeze the signed candidate inventory
        env:
          MP_RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/signing -Recurse -File -Filter '*.mpadapter')
          $metadata = @(Get-ChildItem -LiteralPath artifacts/signing -Recurse -File -Filter 'provider-version.json')
          if ($packages.Count -ne 1 -or $metadata.Count -ne 1) { throw 'The resolved candidate is incomplete.' }
          $output = $packages[0].Directory.FullName
          if ($metadata[0].Directory.FullName -ne $output) { Copy-Item -LiteralPath $metadata[0].FullName -Destination (Join-Path $output 'provider-version.json') }
          ./eng/build-adapter-release-evidence.ps1 -AssetDirectory $output -SourceSha $env:MP_RELEASE_SOURCE_SHA
          ./eng/verify-adapter-release-assets.ps1 -AssetDirectory $output -SourceSha $env:MP_RELEASE_SOURCE_SHA
          New-Item -ItemType Directory -Path artifacts/candidate -Force | Out-Null
          Get-ChildItem -LiteralPath $output -File | Copy-Item -Destination artifacts/candidate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-adapter
          path: artifacts/candidate/*
          if-no-files-found: error
          retention-days: 365

  conformance:
    needs: [resolve, sign]
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
          path: provider
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MirrorPulse/MirrorPulse
          ref: 4324988f8e7f4262cc27fb399d1dc61741fcd3eb
          persist-credentials: false
          path: product
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: provider/global.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-adapter
          path: provider/artifacts/candidate
      - name: Verify the exact signed package in the native runner and production Host
        working-directory: provider
        env:
          MP_RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: ./eng/verify-signed-adapter-process.ps1 -AssetDirectory artifacts/candidate -SourceSha $env:MP_RELEASE_SOURCE_SHA -ProductRepositoryPath ../product
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: signed-process-${{ matrix.runner }}
          path: |
            provider/artifacts/candidate/process-*/*.trx
            provider/artifacts/candidate/process-*/*-evidence.json
          if-no-files-found: error
          retention-days: 365

  publish:
    needs: [resolve, sign, conformance]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: windows-latest
    environment: ${{ needs.resolve.outputs.channel }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-adapter
          path: artifacts/candidate
      - name: Publish only the verified immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          MP_RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: ./eng/publish-adapter-release.ps1 -AssetDirectory artifacts/candidate -SourceSha $env:MP_RELEASE_SOURCE_SHA
